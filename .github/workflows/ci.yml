name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=ci;Username=ci;Password=ci
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PortfolioTracker.slnx

      - name: Build
        run: dotnet build PortfolioTracker.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test PortfolioTracker.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PortfolioTracker.Frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: PortfolioTracker.Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  market-data-service:
    name: Market Data Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-data-service
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-data-service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=ci;Username=ci;Password=ci
    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: docker compose build
