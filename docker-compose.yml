services:
  market-data-service:
    build:
      context: ./market-data-service
      dockerfile: Dockerfile
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./PortfolioTracker.API
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Set ConnectionStrings__DefaultConnection in your environment or .env file}
      Database__AutoMigrate: "true"
      Https__Redirect: "false"
      MarketData__BaseUrl: http://market-data-service:8000
    depends_on:
      market-data-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./PortfolioTracker.Frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    networks:
      default: {}
      cloudflare_network:
        aliases:
          - portfolio-tracker-frontend
    restart: unless-stopped

networks:
  cloudflare_network:
    external: true
